name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release:
    if: "github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore(release)')"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Git Identity
        run: |
          git config --global user.name 'floydspace-bot'
          git config --global user.email 'floydspace-bot@users.noreply.github.com'

      - uses: actions/setup-node@v2
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Clean install
        run: npm ci

      - name: Create release commit and tag
        run: |
          npm run version -- --no-push

      - name: Push release commit and tag
        run: git push --follow-tags

      - name: Publish packages
        run: npm run publish:ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Manual run: publishes the packages of the git tag on the selected ref (lerna publish from-git),
  # e.g. to retry a publish that failed after the release commit and tag were pushed.
  publish:
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v2
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Clean install
        run: npm ci

      - name: Publish packages
        run: npm run publish:ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
